<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Prototipo de Pádel ×4: encuentra jugadores de tu nivel en Valencia.">
</head>
<body>
<title>Pádel ×4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de móvil (máx. 440px) centrada; portada a sangre en tinta, app en fondo claro con barra inferior fija. */
:root{
  --ink:#111111; --lime:#D4F44A; --lime-ink:#2B3300; --bg:#F5F5F2; --card:#FFFFFF;
  --line:#E3E3DC; --muted:#6B6B62; --soft:#ECECE5; --danger:#B42318; --ok:#3F6212;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;padding-bottom:84px}
.wrap{padding-left:16px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.demo{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 6px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-line{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px;width:auto}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.lime[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.tag.lime{background:var(--lime);color:var(--ink)}
.tag.ink{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.input{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;width:100%}
input,select,textarea{font-size:16px!important}
.input:focus{border-color:var(--ink);outline:none}
.av{flex:none;display:grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:700;color:var(--ink)}
.lvl{font-family:var(--display);font-weight:800;font-size:13px;background:var(--ink);color:var(--lime);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
/* Portada */
.hero{background:var(--ink);color:#fff;min-height:100%;display:flex;flex-direction:column;padding-block:28px 24px}
.hflow{display:flex;flex-direction:column;gap:clamp(8px,2.2vh,20px)}
.hcta2 .btn{padding-block:12px}
@media (max-height:720px){.hero .notice{display:none}.hero h1{font-size:24px!important}.hero .row>img{width:44px!important;height:44px!important}.hflow{gap:6px}.hero{gap:8px!important}}
@media (min-height:900px){.hcta2 .btn{padding-block:14px}}
.hero .tall{display:none}
@media (min-height:900px){.hero .tall{display:flex}.hero p.tall{display:block}.hero ul.tall{display:flex}.hero .short{display:none}.hero span.tall{display:inline}
 .hero h1{font-size:34px!important}.hero .row>img{width:64px!important;height:64px!important}.hstep h3{font-size:17px}.hflow>div>div:last-child{padding:14px!important}}
.hsteps2{margin-top:26px;display:flex;flex-direction:column}
.hstep{display:flex;align-items:center;gap:10px}
.hstep h3{color:#fff;font-size:15px}
.hnum{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid #D4F44A;color:#D4F44A;font-family:var(--display);font-weight:700;font-size:13px;display:grid;place-items:center}
.hday{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#2A2A27;color:#77776E}
.hday.on{background:#D4F44A;color:#111}
.hcta{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#111;border-top:1px solid #2A2A27;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.hero img{width:96px;height:96px;border-radius:22px}
.checks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{color:#E8E8E0;font-size:13px;display:flex;gap:8px;align-items:center}
.checks li::before{content:"✓";width:18px;height:18px;flex:none;border-radius:50%;background:#D4F44A;color:#111;font-size:11px;font-weight:800;display:grid;place-items:center}
.hsteps{list-style:none;counter-reset:st;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.hsteps li{counter-increment:st;color:#C9C9C0;font-size:14px;display:flex;gap:10px;align-items:center}
.hsteps li::before{content:counter(st);width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid #D4F44A;color:#D4F44A;font-family:var(--display);font-weight:700;font-size:12px;display:grid;place-items:center}
.hero h1{font-size:38px;color:#fff;margin-top:18px}
.hero h1 em{font-style:normal;color:var(--lime)}
.slots{display:flex;gap:10px;margin-top:6px}
.slot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.slot.empty{border:2px dashed var(--lime);color:var(--lime);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
@media (prefers-reduced-motion:reduce){.slot.empty{animation:none}*{transition:none!important}}
/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .pill{background:var(--lime)}
.nav .pill{border-radius:999px;padding:3px 14px;display:grid;place-items:center}
.badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--danger);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.top{padding-block:20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(17,17,17,.08)}
.prow{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.prow .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.prow .name{font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0}
/* Hojas */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px))}
.grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(17,17,17,.25)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.calh{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;font-variant-numeric:tabular-nums}
.cal small{font-size:9px;font-weight:600;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.cal.off{border-color:transparent;background:transparent;color:var(--line);font-weight:600}
.calnav{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1}
.calnav[disabled]{opacity:.3;cursor:not-allowed}
.cal.on{background:var(--ink);border-color:var(--ink);color:#fff}
.daybox{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.daybox.off{opacity:1;background:var(--card)}
.half{font-size:12px;padding:5px 8px;font-variant-numeric:tabular-nums}
.slots4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot4{aspect-ratio:1;max-width:100%;border-radius:16px;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:700;padding:4px}
.slot4.free{border:2px dashed var(--ink);color:var(--muted)}
.bubble{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14px}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.celebrate{background:var(--ink);color:#fff;text-align:center;border-radius:22px;padding:26px 18px}
.celebrate h2{color:var(--lime);font-size:34px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--ink)}
.notice{font-size:12px;color:var(--muted);text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.needs{outline:2.5px solid var(--danger);outline-offset:6px;border-radius:14px;transition:outline-color .3s}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>

var DAYS=[];(function(){var d=new Date();d.setHours(0,0,0,0);var endM=new Date(d.getFullYear(),d.getMonth()+3,0);for(var i=0;i<100;i++){var x=new Date(d);x.setDate(d.getDate()+i);DAYS.push({key:x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"),dow:x.getDay(),num:x.getDate()});if(x>=endM)break;}})();

function inter(a,b){var B={};b.forEach(function(x){B[x]=1;});return a.filter(function(x){return B[x];});}
function runs(slots){ /* agrupa por día en tramos contiguos */
 var by={};slots.forEach(function(s){var p=s.split("|");(by[p[0]]=by[p[0]]||[]).push(+p[1]);});
 var out=[];Object.keys(by).sort().forEach(function(k){var ms=by[k].sort(function(a,b){return a-b;});var st=ms[0],pr=ms[0];
  for(var i=1;i<=ms.length;i++){if(i<ms.length&&ms[i]===pr+30){pr=ms[i];continue;}out.push({day:k,from:st,to:pr+30});if(i<ms.length){st=ms[i];pr=ms[i];}}});
 return out;}
function playable(slots){return runs(notPast(slots)).filter(function(r){return r.to-r.from>=90;});}
var NOWK=DAYS[0].key,NOWM=(function(){var n=new Date();return n.getHours()*60+n.getMinutes()+60;})();
function notPast(slots){return slots.filter(function(x){var p=x.split("|");return p[0]!==NOWK||+p[1]>=NOWM;});}

/* ---------- Compatibilidad ---------- */
function mySide(){var s=S.search;return 1+(s?s.partners.length:0);}
function fitsLevel(lvl,range){return lvl>=range[0]-1&&lvl<=range[1]+1&&Math.max(range[1],lvl)-Math.min(range[0],lvl)<=2;}
function fitsTipo(g,tipo){return tipo==="indiferente"||tipo==="mixta"||(tipo==="femenina"&&g==="mujer")||(tipo==="masculina"&&g==="hombre");}
function common(a,b){return a.filter(function(x){return b.indexOf(x)>-1;});}
function compatible(p,ctx){ /* ctx: {size, lvl:[min,max], clubs, slots, tipo, exclude} */
 if(ctx.exclude&&ctx.exclude.indexOf(p.id)>-1)return null;
 if(ctx.size+p.size>4)return null;
 if(!fitsLevel(p.lvl,ctx.lvl))return null;
 if(!fitsTipo(p.g,ctx.tipo))return null;
 var c=common(ctx.clubs,p.clubs);if(!c.length)return null;
 var sl=onlyPlayable(inter(ctx.slots,pslots(p)));if(!sl.length)return null;
 return {clubs:c,slots:sl};}
function searchCtx(){var s=S.search,l=[S.me.lvl].concat(s.partners.map(function(x){return +x.lvl;}));
 var busy=s.partners.map(function(x){return x.pid;}).filter(Boolean);S.outgoing.forEach(function(o){if(o.status==="pendiente"&&!o.group)busy.push(o.to);});
 S.groups.forEach(function(g){if(g.stage==="formando")g.members.forEach(function(m){if(m.pid)busy.push(m.pid);});});
 return {size:mySide(),lvl:[Math.min.apply(null,l),Math.max.apply(null,l)],clubs:s.clubs,slots:s.slots,tipo:s.tipo,exclude:busy};}

function tog(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);return arr;}

 return "";}

  var others=g.members.filter(function(m){return !m.me;});var R=["¡Perfecto!","Yo puedo reservar en "+club(g.clubs[0]).n+".","Llevo bolas nuevas.","¿Cervezas después?","Me va bien, ¡nos vemos!"];
